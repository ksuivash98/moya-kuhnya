name: Проверки проекта
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --node-modules-dir=manual supabase/functions/recipe-import/index.ts supabase/functions/kitchen-assistant/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:pages
